<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kit & Me — Stateful AI that remembers you, locally.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000000;
            color: #F0F2F6;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Hero */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(239, 99, 55, 0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        .hero h1 .accent {
            color: #EF6337;
        }

        .hero p {
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            color: #F0F2F6;
            opacity: 0.8;
            max-width: 600px;
            margin-bottom: 2.5rem;
        }

        .cta-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 0.9rem 2rem;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .btn-primary {
            background-color: #EF6337;
            color: #000000;
        }

        .btn-primary:hover {
            background-color: #A81B0A;
            color: #F0F2F6;
        }

        .btn-secondary {
            background-color: transparent;
            color: #F0F2F6;
            border: 1px solid #EF6337;
        }

        .btn-secondary:hover {
            background-color: #EF6337;
            color: #000000;
        }

        /* Tags */
        .tags {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 3rem;
            flex-wrap: wrap;
        }

        .tag {
            padding: 0.4rem 1.2rem;
            border: 1px solid #A81B0A;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #EF6337;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Sections */
        .section {
            padding: 6rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section h2 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        .section h2 .accent {
            color: #EF6337;
        }

        .section-intro {
            font-size: 1.2rem;
            opacity: 0.8;
            max-width: 700px;
            margin-bottom: 3rem;
        }

        /* Problem */
        .problem-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .problem-card {
            padding: 2rem;
            border-left: 3px solid #A81B0A;
            background: rgba(239, 99, 55, 0.03);
        }

        .problem-card h3 {
            color: #EF6337;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .problem-card p {
            opacity: 0.7;
        }

        /* Use Cases */
        .use-cases {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .use-case {
            padding: 2rem;
            border: 1px solid rgba(239, 99, 55, 0.2);
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .use-case:hover {
            border-color: #EF6337;
            background: rgba(239, 99, 55, 0.05);
            transform: translateY(-2px);
        }

        .use-case .icon {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .use-case h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #F0F2F6;
        }

        .use-case p {
            font-size: 0.95rem;
            opacity: 0.7;
        }

        /* Privacy */
        .privacy {
            text-align: center;
            padding: 8rem 2rem;
            background: linear-gradient(180deg, transparent 0%, rgba(168, 27, 10, 0.05) 100%);
        }

        .privacy h2 {
            font-size: clamp(2rem, 5vw, 3.5rem);
        }

        .privacy p {
            font-size: 1.3rem;
            opacity: 0.8;
            max-width: 600px;
            margin: 1.5rem auto;
        }

        .privacy .promise {
            font-size: 1.5rem;
            color: #EF6337;
            font-weight: 600;
            margin-top: 2rem;
        }

        /* Footer */
        footer {
            padding: 3rem 2rem;
            text-align: center;
            border-top: 1px solid rgba(239, 99, 55, 0.1);
        }

        footer p {
            opacity: 0.5;
            font-size: 0.9rem;
        }

        footer a {
            color: #EF6337;
            text-decoration: none;
        }

        footer a:hover {
            color: #A81B0A;
        }

        @media (max-width: 768px) {
            .section {
                padding: 4rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Hero -->
    <section class="hero">
        <h1>Your AI shouldn't<br>have a <span class="accent">cloud.</span></h1>
        <p>Stateful AI that remembers you — across days, weeks, conversations. Everything local. Everything yours.</p>
        <div class="cta-group">
            <a href="#use-cases" class="btn btn-primary">See what it does</a>
            <a href="#" class="btn btn-secondary">Get the code</a>
        </div>
        <div class="tags">
            <span class="tag">Kind</span>
            <span class="tag">Intelligent</span>
            <span class="tag">Technology</span>
        </div>
    </section>

    <!-- Problem -->
    <section class="section">
        <h2>Every AI <span class="accent">forgets</span> you.</h2>
        <p class="section-intro">You talk, they respond, they forget. Every conversation starts from zero. Your data lives on someone else's server. This is the fundamental limitation of every chatbot, assistant, and "AI companion" on the market.</p>
        <div class="problem-grid">
            <div class="problem-card">
                <h3>Stateless</h3>
                <p>No memory of last week. No memory of last month. No continuity, no relationship, no trust built over time.</p>
            </div>
            <div class="problem-card">
                <h3>Cloud-dependent</h3>
                <p>Your conversations, your emotions, your health data — all on someone else's server. They own it. You don't.</p>
            </div>
            <div class="problem-card">
                <h3>Forgetful</h3>
                <p>Even "memory features" are crude. A list of facts. No connections, no emotional weight, no understanding of what matters.</p>
            </div>
        </div>
    </section>

    <!-- Use Cases -->
    <section class="section" id="use-cases">
        <h2>What it <span class="accent">becomes.</span></h2>
        <p class="section-intro">Same architecture. Different purposes. The core is memory that persists, context that loads intelligently, emotional state that carries across conversations, and autonomy between interactions.</p>
        <div class="use-cases">
            <div class="use-case">
                <div class="icon">🧠</div>
                <h3>Personal Knowledge Assistant</h3>
                <p>Remembers what you told it last month. Connects dots between conversations weeks apart. Knows your goals and surfaces them when relevant.</p>
            </div>
            <div class="use-case">
                <div class="icon">💗</div>
                <h3>Therapy Support</h3>
                <p>Tracks emotional patterns over time. Notices when "anxious" shows up three entries in a row. Privacy-first so people actually use it.</p>
            </div>
            <div class="use-case">
                <div class="icon">📞</div>
                <h3>Customer Support That Remembers</h3>
                <p>"Last time you called, we tried X. That didn't work. Want to try Y?" Support that doesn't make you repeat yourself every call.</p>
            </div>
            <div class="use-case">
                <div class="icon">📚</div>
                <h3>Personal Tutor</h3>
                <p>Knows what you struggled with last week. Knows your learning style. Knows when you're frustrated vs. bored. Adapts.</p>
            </div>
            <div class="use-case">
                <div class="icon">✍️</div>
                <h3>Creative Collaboration</h3>
                <p>Remembers the story you're building. The characters. The plot. Catches contradictions you forgot you made.</p>
            </div>
            <div class="use-case">
                <div class="icon">💊</div>
                <h3>Health Companion</h3>
                <p>Tracks symptoms, medications, lifestyle. Connects the dots: "Your mood improved when you started walking in the morning."</p>
            </div>
            <div class="use-case">
                <div class="icon">❤️</div>
                <h3>Relationship Memory</h3>
                <p>Couples therapy support. Long-distance maintenance. Parent-child memory. Caregiver support. Milestones that matter.</p>
            </div>
            <div class="use-case">
                <div class="icon">🔬</div>
                <h3>Research Assistant</h3>
                <p>Remembers every source you've read. Connects ideas across papers months apart. Keeps sensitive research local.</p>
            </div>
        </div>
    </section>

    <!-- Privacy -->
    <section class="privacy">
        <h2>Your AI. <span style="color: #EF6337;">Your data.</span></h2>
        <p>Everything runs locally. Nothing in the cloud. No company owns your conversations, your emotions, your memories.</p>
        <p class="promise">Everything local. Everything yours. Nothing in the cloud.</p>
    </section>

    <!-- Footer -->
    <footer>
        <p>Kit & Me — Built by Garrett, with help from Kit.</p>
        <p><a href="#">GitHub</a> · <a href="#">Contact</a></p>
    </footer>

</body>
</html>
